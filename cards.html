<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Card Album — Rank Up City</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#05050e">
<link rel="manifest" href="manifest.json">
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
<link rel="preload" href="assets/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css?v=1">
<style>
:root {
  --cyan: #00e5ff; --magenta: #ff3df0; --purple: #9d4dff; --gold: #ffc83d;
  --green: #3dffa0; --red: #ff5d7a; --bg: #05050e; --panel: rgba(20, 22, 48, 0.93);
  --text: #eaf7ff; --muted: #7fd9e8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Share Tech Mono", monospace; background-color: var(--bg);
  background-image:
    radial-gradient(1px 1px at 20% 30%, #ffffff88 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 15%, #ffffff66 50%, transparent 51%),
    radial-gradient(2px 2px at 85% 60%, #9d4dff55 50%, transparent 51%),
    radial-gradient(1px 1px at 40% 80%, #00e5ff55 50%, transparent 51%),
    radial-gradient(2px 2px at 60% 45%, #ff3df044 50%, transparent 51%);
  background-size: 520px 520px; color: var(--text); line-height: 1.6;
  padding: 18px 10px 50px; font-size: 16px; min-height: 100vh; min-height: 100dvh;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(rgba(5,5,14,0.72), rgba(5,5,14,0.86)), url("nebula.webp") center / cover no-repeat;
}
.wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 2; }
.marquee { text-align: center; margin-bottom: 10px; }
.marquee img { height: 72px; max-width: 84%; object-fit: contain; background: #000; padding: 7px 13px; border: 2px solid var(--cyan); border-radius: 14px; box-shadow: 0 0 16px #00e5ff55, inset 0 0 12px #00e5ff22; }
h1 { font-family: "Press Start 2P", monospace; font-size: clamp(0.95rem, 4.4vw, 1.4rem); color: var(--gold); text-shadow: 2px 0 0 #000, 0 0 16px var(--gold); letter-spacing: 2px; text-align: center; margin: 10px 0 6px; }
.count { text-align: center; font-family: "Press Start 2P", monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
.bar { width: 200px; height: 8px; margin: 0 auto 18px; background: #10122a; border-radius: 999px; overflow: hidden; border: 1px solid #2a3a5a; }
.bar > div { height: 100%; background: var(--gold); border-radius: 999px; box-shadow: 0 0 8px var(--gold); transition: width 0.4s; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 460px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card { position: relative; border: 2px solid var(--rc, #2a3a5a); border-radius: 14px; background: #0c0c22; padding: 10px 8px 12px; text-align: center; box-shadow: 0 0 12px var(--rg, transparent); animation: popIn 0.35s ease-out backwards; }
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}.card:nth-child(7){animation-delay:.24s}.card:nth-child(8){animation-delay:.28s}
.card.locked { border-style: dashed; opacity: 0.7; }
.rar { font-family: "Press Start 2P", monospace; font-size: 0.62rem; letter-spacing: 1px; color: var(--rc); text-shadow: 0 0 6px var(--rg); }
.face { height: 88px; display: flex; align-items: center; justify-content: center; margin: 8px 0 6px; }
.face .ficon { font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 0 10px currentColor); }
.face .ficon > * { margin: 0; }
.set-h { grid-column: 1 / -1; font-family: "Press Start 2P", monospace; font-size: 0.66rem; letter-spacing: 1px; color: var(--cyan); text-align: left; margin: 10px 2px 0; }
.face img { max-height: 88px; max-width: 90%; object-fit: contain; }
.face .q { font-family: "Press Start 2P", monospace; font-size: 1.8rem; color: #2a3a5a; }
.cname { font-family: "Press Start 2P", monospace; font-size: 0.62rem; color: #fff; letter-spacing: 1px; margin-bottom: 5px; }
.card.locked .cname { color: #5a6a8a; }
.cquote { font-size: 0.74rem; color: var(--muted); font-style: italic; line-height: 1.4; min-height: 2.4em; }
.cpaws { font-family: "Press Start 2P", monospace; font-size: 0.62rem; color: var(--gold); margin-top: 7px; }
.clock { font-size: 0.72rem; color: #5a6a8a; margin-top: 7px; }
.newtag { position: absolute; top: -8px; right: -6px; font-family: "Press Start 2P", monospace; font-size: 0.62rem; color: #04180d; background: var(--green); border-radius: 6px; padding: 3px 6px; box-shadow: 0 0 8px var(--green); }

.actions { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
.btn { display: inline-flex; align-items: center; gap: 7px; font-family: "Press Start 2P", monospace; font-size: 0.62rem; background: linear-gradient(180deg, #2b0a2f, #170618); color: #ffb3f8; border: 2px solid #ff6cf5; border-radius: 11px; padding: 12px 16px; cursor: pointer; letter-spacing: 1px; text-shadow: none; box-shadow: 0 0 16px #ff3df055, inset 0 0 14px #ff3df022; text-decoration: none; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 26px #ff3df0aa, inset 0 0 18px #ff3df044; }
.btn.cyan { background: linear-gradient(180deg, #0b2a34, #061620); border-color: #4ae0f5; box-shadow: 0 0 16px #00e5ff55, inset 0 0 14px #00e5ff22; color: #8df3ff; text-shadow: none; }
@keyframes popIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.music-btn { position: fixed; top: 10px; right: 10px; z-index: 40; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--magenta); background: var(--panel); color: var(--magenta); font-size: 1.05rem; cursor: pointer; box-shadow: 0 0 10px #ff3df044; }
.music-btn:hover { box-shadow: 0 0 16px #ff3df088; }

.spk-btn>*,.mute-btn>*{margin-right:0;width:62%;height:62%}.btn>ico-play{margin-right:.3em}
.sw{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:var(--c);border:1px solid #ffffff55;vertical-align:-.1em;margin-right:.28em;box-shadow:0 0 6px var(--c)}
.lang-tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:0.62rem;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:2px 5px;margin:0 2px;vertical-align:middle}
</style>
<link rel="stylesheet" href="assets/icons.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="marquee"><img src="logo.webp" alt="English for All — Rank Up"></div>
  <h1><ico-star></ico-star> CARD ALBUM <ico-star></ico-star></h1>
  <div class="count" id="count">0 / 15 COLLECTED</div>
  <div class="bar"><div id="bar" style="width:0%"></div></div>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <a class="btn cyan" href="neon-cafe.html"><ico-mug></ico-mug> PLAY THE CAFÉ</a>
    <a class="btn cyan" href="neon-office.html"><ico-briefcase></ico-briefcase> PLAY THE OFFICE</a>
    <a class="btn" href="city.html"><ico-city></ico-city> CITY MAP</a>
  </div>
</div>

<script>
"use strict";
let prog = {};
try { prog = JSON.parse(localStorage.getItem("nc_prog") || "{}"); } catch (e) {}
let oprog = {};
try { oprog = JSON.parse(localStorage.getItem("no_prog") || "{}"); } catch (e) {}
const OFFICE_MAX = 15;   // every Office Tower stage has 5 rounds x 3 paws
const OFFICE_NAME = { s1: "First day", s2: "Work stories", s3: "The client call", s4: "The big project", sb: "The interview" };
const MAXPAWS = { s1: 15, s2: 12, s3: 15, s4: 12, sb: 12 };
const STAGE_NAME = { s1: "First shift", s2: "Rush hour", s3: "Lost & found", s4: "Quiz night", sb: "The inspection" };
const RARITY = {
  COMMON:    { c: "#00e5ff", g: "#00e5ff44" },
  RARE:      { c: "#3dffa0", g: "#3dffa044" },
  EPIC:      { c: "#9d4dff", g: "#9d4dff55" },
  LEGENDARY: { c: "#ffc83d", g: "#ffc83d66" },
  SECRET:    { c: "#ff3df0", g: "#ff3df066" }
};
const CARDS = [
  { id: "neoncup", stage: "s1", name: "NEON CUP", rarity: "COMMON", img: "item-flatwhite.webp", quote: "Full of potential. Refill and retry." },
  { id: "mia",     stage: "s1", name: "MIA",      rarity: "RARE",   img: "sprite-mia.webp",  quote: "The regular. Bright, kind, from Brazil." },
  { id: "jack",    stage: "s2", name: "JACK",     rarity: "RARE",   img: "sprite-jack.webp", quote: "Big order, bigger heart. Cheers, mate." },
  { id: "dan",     stage: "s3", name: "DAN",      rarity: "RARE",   img: "sprite-dan.webp",  quote: "The manager on the radio. Believes in you." },
  { id: "enri",    stage: "s3", name: "ENRI",     rarity: "EPIC",   img: "sprite-enri.webp", quote: "I nap, and success finds me." },
  { id: "vera",    stage: "s4", name: "VERA",     rarity: "EPIC",   img: "sprite-vera.webp", quote: "One latte. And I am always watching." },
  { id: "totti",   stage: "sb", name: "TOTTI",    rarity: "LEGENDARY", img: "sprite-totti.webp", quote: "I observe. I judge. Then I nap." },
  { id: "inspector", stage: "sb", perfect: true, name: "INSPECTOR VERA", rarity: "SECRET", img: "sprite-vera-inspector.webp", quote: "Inspection passed. A perfect café." },
  { id: "pass",     game: "office", stage: "s1", name: "OFFICE PASS", rarity: "COMMON", img: "building-office.webp", quote: "Everyone starts on day one." },
  { id: "sofia",    game: "office", stage: "s1", name: "SOFIA",    rarity: "RARE", icon: "people", color: "var(--magenta)", quote: "The team lead. Welcome aboard!" },
  { id: "marcos",   game: "office", stage: "s2", name: "MARCOS",   rarity: "RARE", icon: "window", color: "var(--green)", quote: "The developer. Home office on Fridays." },
  { id: "ana",      game: "office", stage: "s3", name: "ANA",      rarity: "EPIC", icon: "phone", color: "var(--gold)", quote: "The client. Could you send the two plans?" },
  { id: "launch",   game: "office", stage: "s4", name: "LAUNCH DAY", rarity: "EPIC", icon: "rocket", color: "var(--cyan)", quote: "We're launching the app on Friday." },
  { id: "director", game: "office", stage: "sb", name: "THE DIRECTOR", rarity: "LEGENDARY", icon: "crown", color: "var(--gold)", quote: "Results. I like results." },
  { id: "offer",    game: "office", stage: "sb", perfect: true, name: "JOB OFFER", rarity: "SECRET", icon: "trophy", color: "var(--magenta)", quote: "A perfect interview. You're hired." }
];
function progOf(c) { return (c.game === "office" ? oprog : prog)[c.stage]; }
function maxOf(c) { return c.game === "office" ? OFFICE_MAX : MAXPAWS[c.stage]; }

function earned(c) {
  const p = progOf(c);
  if (!p) return false;
  if (c.perfect) return p.best >= maxOf(c);
  return true;
}

const grid = document.getElementById("grid");
let got = 0;
let lastGame = null;
CARDS.forEach(c => {
  const game = c.game || "cafe";
  if (game !== lastGame) {
    lastGame = game;
    const h = document.createElement("div"); h.className = "set-h";
    h.textContent = game === "office" ? "THE OFFICE TOWER" : "THE NEON CAFÉ";
    grid.appendChild(h);
  }
  const has = earned(c);
  if (has) got++;
  const r = RARITY[c.rarity];
  const p = progOf(c);
  const card = document.createElement("div");
  card.className = "card" + (has ? "" : " locked");
  card.style.setProperty("--rc", has ? r.c : "#2a3a5a");
  card.style.setProperty("--rg", has ? r.g : "transparent");
  if (has) {
    card.innerHTML =
      '<div class="rar">' + (c.rarity === "SECRET" ? "<ico-star></ico-star> SECRET <ico-star></ico-star>" : c.rarity) + '</div>' +
      '<div class="face">' + (c.img ? '<img src="' + c.img + '" alt="' + c.name + '">' : '<span class="ficon" style="color:' + c.color + '"><ico-' + c.icon + '></ico-' + c.icon + '></span>') + '</div>' +
      '<div class="cname">' + c.name + '</div>' +
      '<div class="cquote">"' + c.quote + '"</div>' +
      (p ? '<div class="cpaws">BEST ' + p.best + '/' + maxOf(c) + ' <ico-paw></ico-paw></div>' : "");
  } else {
    const how = c.game === "office" ? (c.perfect ? "Perfect the interview" : "Clear " + OFFICE_NAME[c.stage])
                                     : (c.perfect ? "Perfect the inspection" : "Clear " + STAGE_NAME[c.stage]);
    card.innerHTML =
      '<div class="rar" style="color:#5a6a8a">' + (c.rarity === "SECRET" ? "??? SECRET" : c.rarity) + '</div>' +
      '<div class="face"><span class="q">?</span></div>' +
      '<div class="cname">? ? ?</div>' +
      '<div class="clock"><ico-lock></ico-lock> ' + how + '</div>';
  }
  grid.appendChild(card);
});

document.getElementById("count").textContent = got + " / " + CARDS.length + " COLLECTED";
document.getElementById("bar").style.width = Math.round(got / CARDS.length * 100) + "%";

/* ---------- background music ---------- */
(function(){
  if(!window.Audio) return;
  var KEY="nc_music";
  var on=(localStorage.getItem(KEY)||"on")==="on";
  var m=new Audio("efa-theme.mp3"); m.loop=true; m.preload="none"; m.volume=0.3;
  window.__ncMusic=m; window.__ncMusicVol=0.3;
  var last=parseFloat(sessionStorage.getItem("nc_music_t")||"0");
  if(last>0){ m.addEventListener("loadedmetadata",function(){ try{ m.currentTime=last%(m.duration||1);}catch(e){} },{once:true}); }
  var btn=document.createElement("button");
  btn.className="music-btn"; btn.title="Music on/off"; btn.setAttribute("aria-label","Music on/off");
  function draw(){ btn.innerHTML=on?"<ico-music></ico-music>":"<ico-mute></ico-mute>"; btn.style.opacity=on?"1":"0.5"; }
  draw(); document.body.appendChild(btn);
  var started=false;
  function start(){ if(started||!on) return; started=true; m.play().catch(function(){ started=false; }); }
  ["pointerdown","keydown","touchstart"].forEach(function(ev){ document.addEventListener(ev,start,{once:true,passive:true}); });
  btn.addEventListener("click",function(e){ e.stopPropagation(); on=!on; localStorage.setItem(KEY,on?"on":"off"); draw(); if(on){ started=true; m.play().catch(function(){}); } else { m.pause(); } });
  window.addEventListener("pagehide",function(){ try{ sessionStorage.setItem("nc_music_t",String(m.currentTime||0)); }catch(e){} });
})();
</script>
</body>
</html>
